spring:
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:food_ordering_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  flyway:
    enabled: false

server:
  port: 8080

jwt:
  secret: test-food-ordering-system-secret-key-32chars-minimum
  access-token-expiration-ms: 900000
  refresh-token-expiration-ms: 604800000

payments:
  mpesa:
    enabled: false
