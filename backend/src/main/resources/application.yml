spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: backend
  devtools:
    restart:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Food_Ordering_db}
    username: ${DB_USERNAME:food_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    max-swallow-size: 10MB
    max-http-form-post-size: 10MB

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,https://food-ordering-system-elvis-3170.vercel.app,https://food-ordering-system-git-main-elvis-3170.vercel.app,https://*-elvis-3170.vercel.app}
  mail:
    from: no-reply@foodordering.local

google:
  maps:
    base-url: https://maps.googleapis.com
    api-key: ${GOOGLE_MAPS_API_KEY:}

payments:
  pricing:
    delivery-fee: ${DELIVERY_FEE:150.00}
    service-fee: ${SERVICE_FEE:35.00}
    tax-rate: ${TAX_RATE:0.00}
    discount-amount: ${DISCOUNT_AMOUNT:0.00}
  mpesa:
    enabled: ${MPESA_ENABLED:false}
    environment: ${MPESA_ENVIRONMENT:sandbox}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:}
    passkey: ${MPESA_PASSKEY:}
    callback-url: ${MPESA_CALLBACK_URL:}
    callback-secret: ${MPESA_CALLBACK_SECRET:}

security:
  rate-limit:
    ignore-localhost: false
