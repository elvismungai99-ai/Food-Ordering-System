spring:
  config:
    import: optional:classpath:application-local.yml
  application:
    name: backend
  devtools:
    restart:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/Food_Ordering_db}
    username: ${DB_USERNAME:food_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE_ON_MIGRATE:false}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}

app:
  frontend-base-url: http://localhost:5173
  mail:
    from: no-reply@foodordering.local

google:
  maps:
    base-url: https://maps.googleapis.com
    api-key: ${GOOGLE_MAPS_API_KEY:}

payments:
  pricing:
    delivery-fee: ${DELIVERY_FEE:150.00}
    service-fee: ${SERVICE_FEE:35.00}
    tax-rate: ${TAX_RATE:0.00}
    discount-amount: ${DISCOUNT_AMOUNT:0.00}
  mpesa:
    enabled: ${MPESA_ENABLED:false}
    environment: ${MPESA_ENVIRONMENT:sandbox}
    consumer-key: ${MPESA_CONSUMER_KEY:}
    consumer-secret: ${MPESA_CONSUMER_SECRET:}
    shortcode: ${MPESA_SHORTCODE:}
    passkey: ${MPESA_PASSKEY:}
    callback-url: ${MPESA_CALLBACK_URL:}

security:
  rate-limit:
    ignore-localhost: false


